# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow integrates Brakeman with GitHub's Code Scanning feature
# Brakeman is a static analysis security vulnerability scanner for Ruby on Rails applications

name: Brakeman Scan

on:
  push:
    branches: [ main ]
    paths: ['app/**']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
    paths: ['app/**']
  schedule:
    # cron format: 'minute hour dayofmonth month dayofweek'
    # this will run at noon UTC each Monday (7am EST / 8am EDT)
    - cron: '0 12 * * 1'
defaults:
  run:
    working-directory: ./app

env:
  # Must match local.bucket_name in infra/app/security-scan-reports/main.tf
  REPORTS_BUCKET: dpw-iv-cbv-payroll-security-scan-reports
  # Write-only role in the log-archive account (log_archive_account_id in
  # infra/project-config). Must match aws_iam_role.report_writer in
  # infra/app/security-scan-reports/main.tf. It trusts runs on main only.
  REPORTS_WRITER_ROLE: arn:aws:iam::899776212152:role/iv-cbv-payroll-security-scan-report-writer
  REPORTS_REGION: us-east-1

jobs:
  brakeman-scan:
    name: Brakeman Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC federation in ./.github/actions/configure-aws-credentials
      id-token: write
    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-languages

    # Execute Brakeman CLI.
    #
    # Suppressions live in app/config/brakeman.ignore. Every entry must carry a
    # justification and a ticket number in its `note`; the PR adding it is the
    # approval record. The --ensure flags enforce what Brakeman can check itself:
    #   exit 3  unsuppressed warning
    #   exit 8  --ensure-ignore-notes: an entry has an empty note
    #   exit 9  --ensure-no-obsolete-ignore-entries: an entry matches no warning
    #
    # On exit 9, list the stale fingerprints and delete those entries:
    #   bundle exec brakeman . -f json --no-exit-on-warn \
    #     | ruby -rjson -e 'puts JSON.parse($stdin.read)["obsolete"]'
    # Generate the archival report first, without failing the build. The gate runs last.
    - name: Generate JSON report
      working-directory: app
      run: |
        bundle exec brakeman . \
          -f json \
          -o "${GITHUB_WORKSPACE}/brakeman-report.json" \
          --no-exit-on-warn

    - name: Add CI provenance to report
      working-directory: ${{ github.workspace }}
      run: ruby .github/scripts/enrich_brakeman_report.rb brakeman-report.json

    # A failure in either publishing step below fails the run, so a broken archive
    # cannot pass as a green build. The bucket and writer role live in the
    # log-archive account (`make infra-update-app-security-scan-reports APP_NAME=app`).
    #
    # This deliberately does not use ./.github/actions/configure-aws-credentials:
    # that resolves an app account's deploy role, and the archive account has none.
    # The writer role can only PutObject under brakeman/.
    #
    # PR-run reports are not the audit record -- only main and the weekly schedule
    # are archived, and the role's trust policy accepts only refs/heads/main.
    - name: Configure AWS credentials
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.REPORTS_WRITER_ROLE }}
        aws-region: ${{ env.REPORTS_REGION }}

    # Keyed by date and commit SHA. run id + attempt keep re-runs of the same
    # commit from overwriting each other (the bucket is versioned regardless).
    - name: Publish report to S3
      if: ${{ always() && github.event_name != 'pull_request' }}
      working-directory: ${{ github.workspace }}
      run: |
        if [ ! -s brakeman-report.json ]; then
          echo "::error title=No Brakeman report to archive::brakeman-report.json was not generated, so nothing was published to S3. Check the earlier setup and report steps."
          exit 1
        fi
        key="brakeman/$(date -u +%Y/%m/%d)/${GITHUB_SHA}/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"
        echo "Publishing to s3://${REPORTS_BUCKET}/${key}"
        aws s3 cp brakeman-report.json "s3://${REPORTS_BUCKET}/${key}" \
          --content-type application/json

    # Gate last, so a failing scan is still archived above.
    - name: Scan
      working-directory: app
      run: |
        bundle exec brakeman . \
          --ensure-ignore-notes \
          --ensure-no-obsolete-ignore-entries
