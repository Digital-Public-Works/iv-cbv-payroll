name: Ruby and Javascript dependency scans

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'app/doc/**'
      - 'app/README.md'
  pull_request:
    branches: [ main ]
    paths: ['app/**']
  schedule:
    # cron format: 'minute hour dayofmonth month dayofweek'
    # this will run at noon UTC every day (7am EST / 8am EDT)
    - cron: '0 12 * * *'
  # Manual runs report like scheduled ones. Use one to test the alert path, or to
  # close the tracking issue after a fix instead of waiting for the next cron.
  workflow_dispatch:

jobs:
  bundle-audit:
    name: Bundle audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-languages

      - name: Update advisory database and run checks
        run: bundle exec rake bundler:audit
        working-directory: app

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-languages

      - name: Run npm audit
        working-directory: app
        run: bundle exec rake npm:audit

  ruby-bom:
    name: Ruby SBOM Generation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-languages
      - name: Install cyclonedx
        run: gem install cyclonedx-ruby
      - name: Generate BOM
        working-directory: app
        run: cyclonedx-ruby -p . -o ruby_bom.xml
      - uses: actions/upload-artifact@v7
        with:
          name: ruby-bom
          path: ./app/ruby_bom.xml

  # A failed scheduled or manual run opens an issue assigned to the flaw-remediation
  # owner, who gets an email (or comments on the open one); the next passing run
  # closes it. PR and push runs don't report: those failures already show on the PR
  # or commit.
  report-failure:
    name: Track failure in an issue
    needs: [ bundle-audit, npm-audit, ruby-bom ]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # One report at a time, so overlapping runs can't open two issues.
    concurrency:
      group: dependency-scan-report

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/track-workflow-failure
        with:
          needs-json: ${{ toJSON(needs) }}
          label: dependency-scan-failure
          title: Scheduled dependency scan is failing
          assignees: dpw-quant
