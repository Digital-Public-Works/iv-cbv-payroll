# CodeQL static analysis for the browser JavaScript/TypeScript surface
# (app/app/javascript).
#
# This is CodeQL *advanced setup*: the workflow is committed here rather than enabled
# through Settings -> Code security, because default setup requires repository admin.
# Advanced setup needs no admin rights and keeps the scan configuration in code review.
#
# Code scanning is free on public repositories.
#
# Results are uploaded to the repository's Security -> Code scanning tab as SARIF.
# Note that this workflow does NOT fail on findings.

name: CodeQL

on:
  push:
    # TEMPORARY -- REVERT BEFORE MERGING TO main.
    # rg/pf-808-fix-static-analysis is listed only so this workflow can be
    # exercised on a feature branch without opening a pull request. Restore this
    # to `branches: [ main ]` before the real PR.
    branches: [ main, rg/pf-808-fix-static-analysis ]
    paths:
      - 'app/app/javascript/**'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/codeql-config.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/app/javascript/**'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/codeql-config.yml'
  schedule:
    # Mondays 13:00 UTC, an hour after the Brakeman scan, so the two weekly
    # scans produce independent evidence of continuous operation.
    - cron: '0 13 * * 1'

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to code scanning
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # This identifier covers both JavaScript and TypeScript -- the .ts files
          # under app/app/javascript are analyzed by the same extractor.
          languages: javascript-typescript
          # JS/TS is interpreted; there is nothing to compile.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
