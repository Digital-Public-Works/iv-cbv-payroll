# This workflow checks the status of infrastructure deployments to see whether
# infrastructure code configuration matches the actual state of the infrastructure.
# It does this by checking that Terraform plans show an empty diff (no changes)
# across all root modules and backend configurations.
name: Check infra deploy status

on:
  workflow_dispatch:
    inputs:
      report_issue:
        description: "Open, update, or close the infra-drift issue for this run"
        type: boolean
        default: false
  schedule:
    # Run every day at 07:00 UTC (3am ET, 12am PT) after engineers are likely done with work
    - cron: "0 7 * * *"

jobs:
  collect-configs:
    name: Collect configs
    runs-on: ubuntu-latest
    outputs:
      root_module_configs: ${{ steps.collect-infra-deploy-status-check-configs.outputs.root_module_configs }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect root module configurations
        id: collect-infra-deploy-status-check-configs
        run: |
          root_module_configs="$(./bin/infra-deploy-status-check-configs)"
          echo "${root_module_configs}"
          echo "root_module_configs=${root_module_configs}" >> "$GITHUB_OUTPUT"
  check:
    name: ${{ matrix.root_module_subdir }} ${{ matrix.backend_config_name }}
    runs-on: ubuntu-latest
    needs: collect-configs

    # Skip this job if there are no root module configurations to check,
    # otherwise the GitHub actions will give the error: "Matrix must define at least one vector"
    if: ${{ needs.collect-configs.outputs.root_module_configs != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.collect-configs.outputs.root_module_configs) }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Configure AWS credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          account_name: ${{ matrix.infra_layer == 'accounts' && matrix.account_name || null }}
          network_name: ${{ matrix.infra_layer == 'networks' && matrix.backend_config_name || null }}
          app_name: ${{ contains(fromJSON('["build-repository", "database", "service", "static-assets"]'), matrix.infra_layer) && matrix.app_name || null }}
          environment: ${{ contains(fromJSON('["build-repository", "database", "service", "static-assets"]'), matrix.infra_layer) && matrix.backend_config_name || null }}

      - name: Check Terraform plan
        run: |
          echo "::group::Initialize Terraform"
          echo terraform -chdir="infra/${{ matrix.root_module_subdir }}" init -input=false -reconfigure -backend-config="${{ matrix.backend_config_name }}.s3.tfbackend"
          terraform -chdir="infra/${{ matrix.root_module_subdir }}" init -input=false -reconfigure -backend-config="${{ matrix.backend_config_name }}.s3.tfbackend"
          echo "::endgroup::"

          echo "::group::Check Terraform plan"
          echo terraform -chdir="infra/${{ matrix.root_module_subdir }}" plan -input=false -detailed-exitcode ${{ matrix.extra_params }}
          terraform -chdir="infra/${{ matrix.root_module_subdir }}" plan -input=false -detailed-exitcode ${{ matrix.extra_params }}
          echo "::endgroup::"
        env:
          TF_IN_AUTOMATION: "true"

  report:
    name: Report drift status
    runs-on: ubuntu-latest
    needs: [collect-configs, check]

    if: ${{ always() && (github.event_name == 'schedule' || inputs.report_issue) }}
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRIFT_LABEL: infra-drift

      # Optional GitHub login to assign new drift issues to.
      DRIFT_ASSIGNEE: ""
      COLLECT_RESULT: ${{ needs.collect-configs.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Open, update, or close the drift issue
        run: |
          set -euo pipefail

          if [[ "${COLLECT_RESULT}" == "failure" || "${CHECK_RESULT}" == "failure" ]]; then
            drift=true
          elif [[ "${COLLECT_RESULT}" == "success" && "${CHECK_RESULT}" == "success" ]]; then
            drift=false
          else
            echo "Run did not finish cleanly (collect-configs: ${COLLECT_RESULT}, check: ${CHECK_RESULT}); leaving the drift issue alone."
            exit 0
          fi

          open_issue="$(gh issue list --label "${DRIFT_LABEL}" --state open --limit 1 --json number --jq '.[0].number // empty')"
          run_line="Run: ${RUN_URL} (${EVENT_NAME} on ${REF_NAME}, $(date -u '+%Y-%m-%d %H:%M UTC'))"

          if [[ "${drift}" == "false" ]]; then
            if [[ -z "${open_issue}" ]]; then
              echo "Drift check green and no drift issue open. Nothing to do."
              exit 0
            fi
            printf 'Drift check passed on every job. Closing.\n\n%s\n' "${run_line}" > comment.md
            gh issue comment "${open_issue}" --body-file comment.md
            gh issue close "${open_issue}" --reason completed
            echo "Closed drift issue #${open_issue}"
            exit 0
          fi

          failed_jobs="$(gh run view "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')"
          failed_jobs="${failed_jobs:-"- (see the run)"}"

          if [[ -n "${open_issue}" ]]; then
            printf 'Still failing.\n\n%s\n\nFailed jobs:\n%s\n' "${run_line}" "${failed_jobs}" > comment.md
            gh issue comment "${open_issue}" --body-file comment.md
            echo "Commented on drift issue #${open_issue}"
            exit 0
          fi

          {
            echo "The infrastructure drift check found a difference between the Terraform code and what is deployed, or could not finish."
            echo
            echo "${run_line}"
            echo
            echo "Failed jobs:"
            echo "${failed_jobs}"
            echo
            echo "Open a failed job's **Check Terraform plan** step to see the plan. Fix it by applying that layer, or by changing the code to match what is deployed."
          } > body.md
          gh label create "${DRIFT_LABEL}" --force --color B60205 \
            --description "Opened by the infra drift check (check-infra-deploy-status.yml)"
          issue_url="$(gh issue create --title "Infrastructure drift check failing" --label "${DRIFT_LABEL}" --body-file body.md)"
          echo "Opened ${issue_url}"
          if [[ -n "${DRIFT_ASSIGNEE}" ]]; then
            gh issue edit "${issue_url}" --add-assignee "${DRIFT_ASSIGNEE}" \
              || echo "::warning::Could not assign ${DRIFT_ASSIGNEE} to ${issue_url}"
          fi
