name: CI Infra Checks

on:
  push:
    branches:
      - main
    paths:
      - bin/**
      - infra/**
      - app/**
      - .github/workflows/**
  pull_request:
    paths:
      - bin/**
      - infra/**
      - app/**
      - .github/workflows/**

jobs:
  lint-github-actions:
    # Lint github actions files using https://github.com/rhysd/actionlint
    # This job configuration is largely copied from https://github.com/rhysd/actionlint/blob/main/docs/usage.md#use-actionlint-on-github-actions
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        run: make infra-lint-scripts
  check-terraform-format:
    name: Check Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false
      - name: Run infra-lint-terraform
        run: |
          echo "If this fails, run 'make infra-format'"
          make infra-lint-terraform
  validate-terraform:
    name: Validate Terraform modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false
      - name: Validate
        run: make infra-validate-modules
  validate-terraform-shared:
    name: Validate shared Terraform root modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false
      - name: Validate static-assets
        run: |
          terraform -chdir="infra/app/static-assets" init -backend=false
          terraform -chdir="infra/app/static-assets" validate
      - name: Validate security-scan-reports
        run: |
          terraform -chdir="infra/app/security-scan-reports" init -backend=false
          terraform -chdir="infra/app/security-scan-reports" validate
      - name: Validate log-archive
        run: |
          terraform -chdir="infra/log-archive" init -backend=false
          terraform -chdir="infra/log-archive" validate
  check-compliance-with-checkov:
    name: Check compliance with checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Run Checkov check
        # Pinned to a commit SHA so new checks will not turn main red without any changes to main.
        # This SHA (v12.3143.0) runs ghcr.io/bridgecrewio/checkov:3.4.7.
        uses: bridgecrewio/checkov-action@83b08f51b20950f791f5caadcc92e336b371eb12 # v12.3143.0
        with:
          directory: infra
          framework: terraform
          quiet: true # only displays failed checks
  check-compliance-with-trivy:
    # tfsec was archived by Aquasecurity and its rules folded into Trivy's config scanner
    # see https://github.com/aquasecurity/tfsec/blob/master/tfsec-to-trivy-migration-guide.md.
    name: Check compliance with Trivy (IaC config)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy IaC config scan
        # Action and Trivy binary pinned so their behaviour only changes through a PR. The vulnerability
        # DB is unpinned: so we catch newly published CVEs.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Use the checks embedded in the pinned binary instead of downloading the latest bundle.
          TRIVY_SKIP_CHECK_UPDATE: "true"
        with:
          version: v0.76.2
          # No cache so results depend on the pinned binary.
          cache: "false"
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
