name: "CodeQL config - JavaScript/TypeScript"

# security-extended adds the lower-precision security queries on top of the default
# suite. It does not pull in the code-quality/style queries (that would be
# security-and-quality), so findings stay security-relevant.
queries:
  - uses: security-extended

# Scope analysis to the shipped browser code. Paths are relative to the repository
# root, not to the Rails app directory.
paths:
  - app/app/javascript

paths-ignore:
  # Test code is not part of the deployed surface and produces noise
  # (fixtures deliberately contain fake tokens and unsafe-looking patterns).
  - app/spec/javascript
  - app/node_modules
  - app/vendor
  - app/public/assets
