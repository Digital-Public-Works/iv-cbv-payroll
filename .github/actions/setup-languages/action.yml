name: Set up languages
description: Set up ruby, javascript, and dependencies
runs:
  using: composite
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      env:
        # debase 0.2.9 (development group) uses old-style C declarations that GCC 15,
        # the compiler on ubuntu-latest since the Ubuntu 26.04 image (Nov 2026), rejects
        # under its default C23 mode. Compile it as gnu17 so bundle install succeeds.
        BUNDLE_BUILD__DEBASE: --with-cflags=-std=gnu17
      with:
        working-directory: app
        bundler-cache: true

    - name: Set up node
      uses: actions/setup-node@v7
      with:
        node-version-file: 'app/.node-version'
        cache-dependency-path: 'app/package-lock.json'
        cache: 'npm'

    - name: Install npm dependencies
      shell: bash
      working-directory: app
      run: npm install --frozen-lockfile
