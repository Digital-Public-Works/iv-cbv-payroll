# ==========================================
# DEMO PARTNER — SETTINGS (shared across environments)
# Purpose: shared, environment-agnostic config for a demo partner.
# Applied together with a demo-partner.credentials.<env>.yml document.
# ==========================================

---
partner_id: demo
name: Demo Partner
state_name: Georgia
timezone: America/New_York
domain: demo-partner
website: https://demo-partner.example.org/
logo_path: des_logo.png
default_origin: demo
active_demo: true
active_prod: true
staff_portal_enabled: false
generic_links_enabled: false
invitation_links_enabled: true
invitation_valid_days_default: 10
pay_income_days_w2: 90
pay_income_days_gig: 90
report_customization_show_earnings_list: true
weekly_report_enabled: true
weekly_report_variant: invitations
include_invitation_details_on_weekly_report: true
partner_identifier_name: case_number
application_attributes:
- name: first_name
  description: Applicant first name
  data_type: string
  form_field_type: text_field
  show_on_caseworker_form: true
  show_on_caseworker_report: false
  redactable: true
  redact_type: string
- name: middle_name
  description: Applicant middle name
  data_type: string
  form_field_type: text_field
  show_on_caseworker_form: true
  show_on_caseworker_report: false
  redactable: true
  redact_type: string
- name: last_name
  description: Applicant last name
  data_type: string
  form_field_type: text_field
  show_on_caseworker_form: true
  show_on_caseworker_report: false
  redactable: true
  redact_type: string
- name: case_number
  description: Case number
  data_type: string
  form_field_type: text_field
  show_on_caseworker_form: true
  show_on_caseworker_report: true
  redactable: false
  validation_regex: '\A\d{8}\z'
  required_for_submit: true
- name: income_changes
  description: Income changes
  data_type: string
  form_field_type: text_field
  show_on_caseworker_form: false
  show_on_caseworker_report: false
  redactable: false

# which attributes are part of an invitation when created via invitation flow, and are they required?
invitation_attributes:
- name: case_number
  required: true
- name: first_name
  required: false
- name: middle_name
  required: false
- name: last_name
  required: false
- name: income_changes
  required: false

# attributes that are asked for on the user input page. If there are none, that page will be skipped.
# If all values here are already populated before that step is reached, the page will be skipped.
applicant_input_page:
- name: first_name
  required: true
- name: middle_name
  required: false
- name: last_name
  required: true

translations:
  en:
    shared.agency_acronym: 'DEMO'
    shared.agency_full_name: 'Demo Partner'
    shared.header.cbv_flow_title: 'Department of Demo'
    shared.header.preheader: 'This is a demo site.'
    shared.agency_portal_name: 'Demo Partner Portal'
    cbv.expired_invitations.show.cta_button_html: 'Expired Invitation'
  es:
    shared.agency_acronym: 'DEMO'
    shared.agency_full_name: 'Demo'
    shared.header.cbv_flow_title: 'Departamento de Demo'
    shared.header.preheader: 'Un sitio de demo.'
    shared.agency_portal_name: 'Demo'
    cbv.expired_invitations.show.cta_button_html: 'Su invitación para verificar ingresos ha expirado'
