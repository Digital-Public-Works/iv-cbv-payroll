# ==========================================
# DEMO PARTNER — CREDENTIALS (environment-specific: demo)
# Purpose: env-specific values (argyle mode, endpoints, secrets) for the demo
# partner. Applied together with demo-partner.settings.yml.
# ==========================================

---
partner_id: demo
argyle_environment: sandbox
weekly_report_recipients: test@example.com
transmission_methods:
- method_type: sftp
  configs:
  - key: url
    encrypted: false
    value: "sftp.demo.example.com"
  - key: user
    encrypted: false
    value: "demo_user"
  - key: password
    encrypted: false
    value: "demo_pass"
  - key: path_prefix
    encrypted: false
    value:
