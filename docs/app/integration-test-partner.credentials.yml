# ==========================================
# INTEGRATION TEST PARTNER — CREDENTIALS (environment-specific)
# Purpose: env-specific values (argyle mode, endpoints, secrets) for the
# integration_test partner pointed at the local Docker services.
# Applied together with integration-test-partner.settings.yml via
#   bundle exec rake integration:partner:setup
# ==========================================

---
partner_id: integration_test
argyle_environment: sandbox
transmission_methods:
- method_type: webhook
  configs:
  - key: webhook_url
    encrypted: false
    value: "http://localhost:9292/api/v1/income-report"
  - key: api_key
    encrypted: false
    value: "my-secure-guid"
- method_type: sftp
  configs:
  - key: url
    encrypted: false
    value: "localhost"
  - key: port
    encrypted: false
    value: "2222"
  - key: user
    encrypted: false
    value: "testuser"
  - key: password
    encrypted: false
    value: "testpass"
  - key: path_prefix
    encrypted: false
    value: "upload"
