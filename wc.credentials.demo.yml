# ==========================================
# WEST CAROLINA (WC) — CREDENTIALS (environment-specific: demo)
# Purpose: env-specific values (argyle mode, recipients, endpoints, secrets)
# for the WC template partner. Applied together with wc.settings.yml.
# ==========================================

---
partner_id: wc
argyle_environment: sandbox
weekly_report_recipients: west_carolina@example.org
transmission_methods:
- method_type: sftp
  configs:
  - key: user
    encrypted: false
    value:
  - key: password
    encrypted: true
    value:
  - key: url
    encrypted: false
    value:
  - key: path_prefix
    encrypted: false
    value:
- method_type: webhook
  configs:
  - key: webhook_url
    encrypted: false
    value:
  - key: api_key
    encrypted: true
    value:
  # Optional webhook contract version. "1" (the default when omitted) is the
  # legacy format existing consumers rely on; "2" adds event_type and
  # TransmissionComplete events and stops sending the API key. Kept only for
  # backwards compatibility; to be removed once every partner is on "2".
  - key: contract_version
    encrypted: false
    value: "2"
