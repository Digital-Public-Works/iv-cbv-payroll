# The behavior of RuboCop can be controlled via the .rubocop.yml
# configuration file. It makes it possible to enable/disable
# certain cops (checks) and to alter their behavior if they accept
# any parameters. The file can be placed either in your home
# directory or in some project directory.
#
# RuboCop will start looking for the configuration file in the directory
# where the inspected file is and continue its way up to the root directory.
#
# See https://docs.rubocop.org/rubocop/configuration
plugins:
  - rubocop-rspec

# rubocop-rails-omakase 1.1.0 replaced `AllCops/DisabledByDefault: true` with an
# explicit list of departments to disable. RSpec is not on that list, so the
# rubocop-rspec cops became active on upgrade. Pre-existing offenses are
# grandfathered in .rubocop_todo.yml (regenerate with `--auto-gen-config`);
# the cops are enforced on new and changed spec code.
inherit_from: .rubocop_todo.yml
inherit_gem:
  rubocop-rails-omakase: rubocop.yml
AllCops:
  NewCops: enable

# Re-enable some Cops not included in the rubocop-rails-omakase configuration:
# https://github.com/rails/rubocop-rails-omakase/blob/main/rubocop.yml
Layout/EmptyLineBetweenDefs:
  Enabled: true
Layout/EndAlignment:
  EnforcedStyleAlignWith: keyword
Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: normal
Layout/IndentationWidth:
  Enabled: true
Layout/ParameterAlignment:
  Enabled: true
Naming/VariableName:
  Enabled: true
